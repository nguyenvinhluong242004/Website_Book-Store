<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sách</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Quản lý sách</h1>

        <div class="text-end mb-3">
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">Thêm sách</button>
        </div>

        <!-- Bảng hiển thị sách -->
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên sách</th>
                    <th>Giá gốc</th>
                    <th>Giá giảm</th>
                    <th>Thể loại</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="bookTableBody">
                <!-- Dữ liệu sẽ được tải động từ API -->
            </tbody>
        </table>

        <!-- Phân trang -->
        <nav>
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Các nút phân trang sẽ được tạo động -->
            </ul>
        </nav>
    </div>

    <!-- Modal xem chi tiết -->
    <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailModalLabel">Chi tiết sách</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p><strong>ID:</strong> <span id="detailId"></span></p>
                    <p><strong>Tên sách:</strong> <span id="detailName"></span></p>
                    <p><strong>Giá gốc:</strong> <span id="detailListPrice"></span></p>
                    <p><strong>Giá giảm:</strong> <span id="detailDiscountedPrice"></span></p>
                    <p><strong>Thể loại:</strong> <span id="detailGenre"></span></p>
                    <p><strong>Mô tả:</strong> <span id="detailDescription"></span></p>
                    <p><strong>Tác giả:</strong> <span id="detailAuthor"></span></p>
                    <p><strong>Đối tượng:</strong> <span id="detailAgeGroup"></span></p>
                    <p><strong>Loại bìa:</strong> <span id="detailCoverType"></span></p>
                    <p><strong>Số lượng có sẵn:</strong> <span id="detailAvailableQuantity"></span></p>

                    <h6>Hình ảnh:</h6>
                    <div id="detailImages" class="d-flex flex-wrap gap-2">
                        <!-- Ảnh sẽ được thêm động với checkbox chọn xóa -->
                    </div>

                    <div class="mt-3">
                        <label for="fileUpload" class="form-label">Chọn ảnh mới</label>
                        <input type="file" class="form-control" id="fileUpload" multiple>
                    </div>

                    <button id="saveChanges" class="btn btn-primary mt-3">Lưu thay đổi</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal thêm sách -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addModalLabel">Thêm sách</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addBookForm" action="https://localhost:8888/admin/books" method="POST"
                        enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="bookName" class="form-label">Tên sách</label>
                            <input type="text" class="form-control" id="bookName" required>
                        </div>
                        <div class="mb-3">
                            <label for="listPrice" class="form-label">Giá gốc</label>
                            <input type="number" class="form-control" id="listPrice" required>
                        </div>
                        <div class="mb-3">
                            <label for="discountedPrice" class="form-label">Giá giảm</label>
                            <input type="number" class="form-control" id="discountedPrice" required>
                        </div>
                        <div class="mb-3">
                            <label for="genreName" class="form-label">Thể loại</label>
                            <input type="text" class="form-control" id="genreName" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả</label>
                            <textarea class="form-control" id="description" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="ageGroup" class="form-label">Đối tượng</label>
                            <input type="text" class="form-control" id="ageGroup" required>
                        </div>
                        <div class="mb-3">
                            <label for="author" class="form-label">Tác giả</label>
                            <input type="text" class="form-control" id="author" required>
                        </div>
                        <div class="mb-3">
                            <label for="coverType" class="form-label">Loại bìa</label>
                            <input type="text" class="form-control" id="coverType" required>
                        </div>
                        <div class="mb-3">
                            <label for="availableQuantity" class="form-label">Số lượng có sẵn</label>
                            <input type="number" class="form-control" id="availableQuantity" required>
                        </div>
                        <div class="mb-3">
                            <label for="fileUploadd" class="form-label">Thêm ảnh</label>
                            <input type="file" class="form-control" id="fileUploadd" multiple>
                        </div>
                        <button type="submit" class="btn btn-primary">Thêm</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Thêm Bootstrap JS (sau khi jQuery nếu bạn dùng jQuery) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const apiUrl = '/admin/books';
        let booksData = [];

        // Lấy danh sách sách và hiển thị
        function fetchBooks(page = 1) {
            $.ajax({
                url: `${apiUrl}?page=${page}`,
                method: 'GET',
                success: function (response) {
                    const { data, current_page, total_pages, categories } = response;
                    console.log(categories);
                    booksData = data;
                    renderBooksTable(data);
                    renderPagination(current_page, total_pages);
                },
                error: function (error) {
                    console.error('Error fetching books:', error);
                }
            });
        }

        // Hiển thị bảng sách
        function renderBooksTable(books) {
            const tableBody = $('#bookTableBody');
            tableBody.empty();

            books.forEach(book => {
                const row = `
                    <tr>
                        <td>${book.id_book}</td>
                        <td>${book.book_name}</td>
                        <td>${book.list_price}</td>
                        <td>${book.discounted_price}</td>
                        <td>${book.genre_name}</td>
                        <td>
                            <button class="btn btn-info btn-sm" onclick="viewDetails(${book.id_book})">Xem chi tiết</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteBook(${book.id_book})">Xóa</button>
                        </td>
                    </tr>
                `;
                tableBody.append(row);
            });
        }

        // Hiển thị phân trang
        function renderPagination(currentPage, totalPages) {
            const pagination = $('#pagination');
            pagination.empty();

            for (let i = 1; i <= totalPages; i++) {
                const pageItem = `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <button class="page-link" onclick="fetchBooks(${i})">${i}</button>
                    </li>
                `;
                pagination.append(pageItem);
            }
        }

        // Xem chi tiết sách
        function viewDetails(bookId) {
            const book = booksData.find(b => b.id_book === bookId);

            if (book) {
                $('#detailId').text(book.id_book);
                $('#detailName').text(book.book_name);
                $('#detailListPrice').text(book.list_price);
                $('#detailDiscountedPrice').text(book.discounted_price);
                $('#detailGenre').text(book.genre_name);
                $('#detailDescription').text(book.description);
                $('#detailAuthor').text(book.author);
                $('#detailAgeGroup').text(book.age_group);
                $('#detailCoverType').text(book.cover_type);
                $('#detailAvailableQuantity').text(book.available_quantity);

                // Hiển thị ảnh hiện tại với checkbox để xóa
                const detailImages = $('#detailImages');
                detailImages.empty();
                if (book.images) {
                    book.images.forEach(img => {
                        const imgElement = `
                    <div class="image-container">
                        <img src="${img}" alt="Hình ảnh sách" class="img-thumbnail" style="width: 100px;">
                        <input type="checkbox" class="remove-image" value="${img}"> Xóa
                    </div>
                `;
                        detailImages.append(imgElement);
                    });
                }

                // Lưu thay đổi khi nhấn "Lưu thay đổi"
                $('#saveChanges').off('click').on('click', function () {
                    const formData = new FormData();
                    formData.append('book_name', $('#detailName').text());
                    formData.append('list_price', $('#detailListPrice').text());
                    formData.append('discounted_price', $('#detailDiscountedPrice').text());
                    formData.append('genre_name', $('#detailGenre').text());
                    formData.append('description', $('#detailDescription').text());
                    formData.append('author', $('#detailAuthor').text());
                    formData.append('age_group', $('#detailAgeGroup').text());
                    formData.append('cover_type', $('#detailCoverType').text());
                    formData.append('available_quantity', $('#detailAvailableQuantity').text());

                    // Thêm các ảnh mới
                    const newImages = $('#fileUpload')[0].files;
                    if (newImages.length > 0) {
                        for (let i = 0; i < newImages.length; i++) {
                            formData.append('images', newImages[i]);
                        }
                    }

                    // Lấy các ảnh đã chọn xóa
                    const imagesToDelete = [];
                    $('.remove-image:checked').each(function () {
                        imagesToDelete.push($(this).val());
                    });
                    formData.append('images_to_delete', JSON.stringify(imagesToDelete));

                    // Gửi yêu cầu cập nhật
                    $.ajax({
                        url: `${apiUrl}/change?id=${bookId}`,
                        method: 'PUT',
                        contentType: false,
                        processData: false,
                        data: formData,
                        success: function () {
                            alert('Cập nhật sách thành công!');
                            $('#detailModal').modal('hide');
                            fetchBooks();
                        },
                        error: function (error) {
                            alert('Cập nhật sách thất bại!');
                            console.error('Error updating book:', error);
                        }
                    });
                });

                $('#detailModal').modal('show');
            } else {
                alert('Không tìm thấy thông tin chi tiết!');
            }
        }


        // Thêm sách mới
        $('#addBookForm').on('submit', function (e) {
            e.preventDefault();
            const formData = new FormData();

            // Lấy giá trị từ các trường nhập liệu và thêm vào FormData
            formData.append('book_name', $('#bookName').val());
            formData.append('list_price', $('#listPrice').val());
            formData.append('discounted_price', $('#discountedPrice').val());
            formData.append('genre_name', $('#genreName').val());
            formData.append('description', $('#description').val());
            formData.append('author', $('#author').val());
            formData.append('age_group', $('#ageGroup').val());
            formData.append('cover_type', $('#coverType').val());
            formData.append('available_quantity', $('#availableQuantity').val());
            //console.log(this)
            // Lấy và thêm file vào FormData
            const files = $('#fileUploadd')[0].files;
            if (files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    formData.append('images', files[i]);
                }
            }

            console.log(formData)

            $.ajax({
                url: `${apiUrl}/add`,
                method: 'POST',
                contentType: false,
                processData: false,
                data: formData,
                success: function () {
                    alert('Thêm sách thành công!');
                    $('#addBookForm')[0].reset();
                    $('#addModal').modal('hide');
                    fetchBooks();
                },
                error: function (error) {
                    alert('Thêm sách thất bại!');
                    console.error('Error adding book:', error);
                }
            });
        });

        // Xóa sách
        function deleteBook(bookId) {
            if (!confirm('Bạn có chắc chắn muốn xóa sách này không?')) return;

            $.ajax({
                url: `${apiUrl}/delete?id=${bookId}`,
                method: 'DELETE',
                success: function () {
                    alert('Xóa sách thành công!');
                    fetchBooks();
                },
                error: function (error) {
                    alert('Xóa sách thất bại!');
                    console.error('Error deleting book:', error);
                }
            });
        }

        // Gọi API để tải sách khi tải trang
        $(document).ready(function () {
            fetchBooks();
        });
    </script>
</body>

</html>
