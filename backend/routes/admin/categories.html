<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Quản lý danh mục</h1>

        <!-- Bảng hiển thị danh mục -->
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên danh mục</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="categoryTableBody">
                <!-- Dữ liệu sẽ được tải động từ API -->
            </tbody>
        </table>
        <!-- Điều khiển phân trang -->
        <nav aria-label="Pagination">
            <ul class="pagination justify-content-center" id="paginationControls">
                <!-- Các nút phân trang sẽ được tạo động -->
            </ul>
        </nav>

        <!-- Thêm danh mục -->
        <div class="mt-4">
            <h4>Thêm danh mục mới</h4>
            <form id="addCategoryForm">
                <div class="mb-3">
                    <label for="categoryName" class="form-label">Tên danh mục</label>
                    <input type="text" class="form-control" id="categoryName" placeholder="Nhập tên danh mục" required>
                </div>
                <button type="submit" class="btn btn-primary">Thêm</button>
            </form>
        </div>
    </div>

    <script>
        const apiUrl = '/admin/categories';
        let currentPage = 1;

        // Lấy danh sách danh mục
        async function fetchCategories(page = 1) {
            try {
                const response = await fetch(`${apiUrl}?page=${page}`);
                const { data, total_records, total_pages, per_page } = await response.json();

                // Hiển thị dữ liệu danh mục
                const tableBody = document.getElementById('categoryTableBody');
                tableBody.innerHTML = '';

                data.forEach(category => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${category.id_category}</td>
                        <td>${category.name}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="editCategory(${category.id_category}, '${category.name}')">Sửa</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCategory(${category.id_category})">Xóa</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                // Tạo điều khiển phân trang
                renderPaginationControls(total_pages, page);
            } catch (error) {
                console.error('Error fetching categories:', error);
            }
        }

        // Tạo điều khiển phân trang
        function renderPaginationControls(totalPages, currentPage) {
            const paginationControls = document.getElementById('paginationControls');
            paginationControls.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === currentPage ? 'active' : ''}`;
                li.innerHTML = `<button class="page-link" onclick="changePage(${i})">${i}</button>`;
                paginationControls.appendChild(li);
            }
        }

        // Chuyển đổi trang
        function changePage(page) {
            currentPage = page;
            fetchCategories(page);
        }

        // Thêm danh mục mới
        document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const categoryName = document.getElementById('categoryName').value;

            try {
                const response = await fetch(`${apiUrl}/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: categoryName })
                });

                if (response.ok) {
                    alert('Thêm danh mục thành công!');
                    fetchCategories(currentPage);
                } else {
                    alert('Thêm danh mục thất bại!');
                }
            } catch (error) {
                console.error('Error adding category:', error);
            }
        });

        // Sửa danh mục
        async function editCategory(id, currentName) {
            const newName = prompt('Nhập tên mới cho danh mục:', currentName);
            if (!newName) return;

            try {
                const response = await fetch(`${apiUrl}/change`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, name: newName })
                });

                if (response.ok) {
                    alert('Sửa danh mục thành công!');
                    fetchCategories(currentPage);
                } else {
                    alert('Sửa danh mục thất bại!');
                }
            } catch (error) {
                console.error('Error editing category:', error);
            }
        }

        // Xóa danh mục
        async function deleteCategory(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa danh mục này?')) return;

            try {
                const response = await fetch(`${apiUrl}/delete`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });

                if (response.ok) {
                    alert('Xóa danh mục thành công!');
                    fetchCategories(currentPage);
                } else {
                    alert('Xóa danh mục thất bại!');
                }
            } catch (error) {
                console.error('Error deleting category:', error);
            }
        }

        // Tải danh sách danh mục khi tải trang
        document.addEventListener('DOMContentLoaded', () => fetchCategories(currentPage));
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
