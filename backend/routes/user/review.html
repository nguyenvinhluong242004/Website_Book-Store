<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center">Upload File to Cloudinary</h1>
        <form id="uploadForm" action="https://localhost:8888/detail-book/review" method="POST" enctype="multipart/form-data" class="mt-4">
            <div class="mb-3">
                <label for="file" class="form-label">Choose Images</label>
                <input type="file" name="images" id="file" class="form-control" multiple required>
            </div>
            <div class="mb-3">
                <label for="idBook" class="form-label">Book ID</label>
                <input type="number" name="id_book" id="idBook" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="content" class="form-label">content</label>
                <input type="text" name="content" id="content" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="date" class="form-label">Date (YYYY-MM-DD)</label>
                <input type="date" name="date" id="date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="rating" class="form-label">Rating (1-5)</label>
                <input type="number" name="rating" id="rating" class="form-control" min="1" max="5" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>

        <div id="uploadedFiles" class="mt-4" style="display: none;">
            <h3>Uploaded Files</h3>
            <ul id="fileList"></ul>
        </div>
    </div>

    <script>
        // Thiết lập ngày hiện tại cho trường date
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('date');
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0'); // Tháng từ 0-11, cần +1
            const dd = String(today.getDate()).padStart(2, '0');

            // Gán giá trị ngày hiện tại (YYYY-MM-DD) vào trường date
            dateInput.value = `${yyyy}-${mm}-${dd}`;
        });

        // Xử lý khi gửi form
        document.getElementById('uploadForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const formData = new FormData(this);

            const likeCount = 0; // Mặc định bằng 0

            formData.append('like_count', likeCount);

            console.log(formData)

            try {
                const response = await fetch('https://localhost:8888/detail-book/review', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error('File upload failed');
                }

                const data = await response.json();
                const { fileUrls } = data;

                // Hiển thị danh sách file đã upload
                const uploadedFilesDiv = document.getElementById('uploadedFiles');
                uploadedFilesDiv.style.display = 'block';

                const fileList = document.getElementById('fileList');
                fileList.innerHTML = '';
                fileUrls.forEach(url => {
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
                    fileList.appendChild(li);
                });
            } catch (error) {
                console.error(error);
                alert('An error occurred during file upload. Please try again.');
            }
        });
    </script>

</body>

</html>
